name: Publish NuGet package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        required: true
        default: Core
        options:
          - Core
          - PostgreSql

permissions:
  id-token: write # required for NuGet trusted publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Pack Core
        if: inputs.package == 'Core'
        run: dotnet pack MaterializR.Core/MaterializR.Core.csproj -c Release -o artifacts -p:GeneratePackageOnBuild=false

      - name: Pack PostgreSql
        if: inputs.package == 'PostgreSql'
        run: dotnet pack MaterializR.PostgreSql/MaterializR.PostgreSql.csproj -c Release -o artifacts -p:GeneratePackageOnBuild=false

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
